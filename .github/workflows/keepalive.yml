name: Keep Supabase awake

# Supabase 免費專案閒置一週會被暫停；每天呼叫一次會員 API 的 /health 保持運作
on:
  schedule:
    - cron: "17 3 * * *" # 每天台灣時間 11:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_BASE: "https://tkakorzpbjfclsepmqsb.supabase.co/functions/v1/api" # 與 deploy.yml 的 PUBLIC_API_BASE 相同
        run: |
          if [ -z "$API_BASE" ]; then echo "會員 API 尚未設定，略過"; exit 0; fi
          curl -fsS "$API_BASE/health"
