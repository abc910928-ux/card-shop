name: Deploy to GitHub Pages

# 推到 main 就自動建置並部署
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 會員功能的兩個公開設定；留空時網站照常運作，只是不顯示登入
          PUBLIC_LIFF_ID: "2011840313-v7ovYBx1" # LINE Developers 的 LIFF ID（頻道 2011840313）
          PUBLIC_API_BASE: "https://tkakorzpbjfclsepmqsb.supabase.co/functions/v1/api"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
